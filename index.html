<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121126" />
    <meta name="description" content="Toys vs. Nightmares — a cozy lane-defense game about tiny heroes protecting a child's dreams." />

  <body>
    <main id="stage" aria-label="Toys vs. Nightmares game">
      <canvas id="game" width="480" height="854"></canvas>
      <div id="rotate-hint" aria-hidden="true">

    <div id="boot" aria-hidden="true">
      <div class="boot-star">★</div>

      <div class="boot-sub">Waking the guardians…</div>
    </div>
