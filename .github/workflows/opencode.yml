name: AI Game Generator

on:
  workflow_dispatch:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.label.name == 'build-game' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - run: pip install requests
      
      - name: Run AI
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body || 'Buatkan game Ular pakai Canvas' }}
        run: python generate.py
        
      - name: Push to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Generate Game"
          git push
